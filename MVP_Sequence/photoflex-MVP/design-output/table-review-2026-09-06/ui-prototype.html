<script>

document.getElementById('app').innerHTML=`<header class="topbar"><div class="identity"><button class="brand" onclick="message('Prototype: return to Projects')">Photoflex</button><span class="slash">/</span><span class="project-title">Coastal Notes</span></div><nav class="modes" aria-label="Workspace"><button class="active">Table</button><button onclick="message('Prototype: open active Sequence after successful save')">Sequence</button></nav><div class="saved"><i class="dot"></i>All changes saved</div></header>

<section class="order"><div class="order-resizer" title="Resize Sequence Order" role="separator" aria-label="Resize Sequence Order" aria-orientation="horizontal" tabindex="0"></div><header><strong>Sequence Order</strong>${btn('chevron','Coastal edit','order-name')}<span class="muted order-name">6 photos</span><span class="spacer"></span><span class="order-subtle">Drag to reorder</span>${btn('arrow','Open Sequence','','onclick="message(\'Prototype: save, then open Coastal edit\')"')}${btn('chevron','','icon','aria-label="Collapse Sequence Order" onclick="message(\'Collapsed header: 48 px; expanded height is restored on reopen\')"')}</header><div class="strip">${[1,2,4,5,6,3].map((n,i)=>`<div class="sequence-card" draggable="true"><div class="photo-well"><img src="${photo(n)}" alt="Full photograph, sequence position ${i+1}"></div><div class="sequence-meta"><b>${String(i+1).padStart(2,'0')}</b><span>DSC_${2041+n}.jpg</span></div></div>`).join('')}</div></section></main>
<aside class="sidebar" aria-label="Photo Sources"><div class="resize" role="separator" aria-label="Resize Photo Sources" aria-orientation="vertical" tabindex="0"></div><header class="panel-head"><strong>Photo Sources</strong>${btn('plus','Add Source','','onclick="message(\'Prototype: choose folder in the sidebar; keep Table mounted\')"')}${btn('expand',mode==='compact'?'Expand':'Compact','','onclick="setMode(mode===\'compact\'?\'expanded\':\'compact\')"')}${btn('panel','Collapse','collapse','aria-label="Collapse Photo Sources" onclick="priorMode=mode;setMode(\'closed\')"')}</header><div class="project-row"><span class="project-icon">${ico('folder')}</span><div class="description"><span class="eyebrow">PROJECT</span><strong style="font-size:13px;font-weight:500">Coastal Notes</strong></div>${btn('info','Project details →','','onclick="setMode(\'project\')"')}</div>
<div class="source-body">${view==='project'?`<section class="project-view">${btn('back','Back to Photo Sources','','onclick="setMode(\'expanded\')"')}<h2>Project details</h2><label>Project name<input value="Coastal Notes"></label><label>Cover photograph<div class="cover"><img src="${photo(1)}" alt="Project cover"></div></label><label>Memo<textarea>Photographs collected along the coast. Look for quiet transitions between light, movement and empty space.</textarea></label><p class="muted" style="font-size:11px">Edits in this prototype are temporary.</p><div class="danger-row"><span>Project and saved sequences</span><span class="spacer"></span>${btn('trash','Delete project','','onclick="message(\'Prototype: open explicit project deletion confirmation\')"')}</div></section>`:`<nav class="directory" aria-label="Source directory"><div class="dir-label">SOURCES</div>${[['All Sources','312'],['Coastal Walks','124'],['City Fragments','96'],['Evening Light','92']].map(([name,n],i)=>`<button class="${i===1?'active':''}" onclick="message('Prototype: switch source, preserve selection and scroll anchor')">${ico('folder')}<span>${name}</span><small>${n}</small></button>`).join('')}<div class="disconnect">› Disconnected <span style="float:right">1</span></div></nav><section class="browser"><div class="source-title"><div><h2><button onclick="message('Prototype: choose source from dropdown')">Coastal Walks ${mode==='compact'?ico('chevron'):''}</button></h2><p>124 photos · 18 on Table</p></div>${btn('grid','Contact Sheet','contact-entry','onclick="message(\'Prototype: open this source in Contact Sheet; return restores Table context\')"')}${btn('more','','icon','aria-label="Source actions" onclick="message(\'Source actions: Refresh · Reconnect · Disconnect source…\')"')}</div><label class="search">${ico('search')}<input placeholder="Search photos" aria-label="Search photos" value="${search}" oninput="search=this.value;renderGrid()"></label><nav class="filters" aria-label="Photo filter">${[['all','All'],['new','Not on Table'],['placed','On Table']].map(([v,label])=>`<button data-filter="${v}" class="${filter===v?'active':''}" onclick="filter='${v}';renderGrid()">${label}</button>`).join('')}</nav><div class="grid-scroll"><div class="photo-grid" id="photo-grid"></div></div></section>`}</div>
<footer class="footer"><span id="selection-label"></span>${btn('','Clear','','onclick="selected.clear();renderGrid()"')}<span class="hint">Drag photos onto the table</span><button id="add-button" class="primary" onclick="message('Prototype: add '+selected.size+' eligible photos in one command');selected.clear();renderGrid()"></button></footer><button class="reopen" aria-label="Open Photo Sources" onclick="setMode(priorMode)">${ico('expand')}<span>Photo Sources</span></button><div class="error-banner"><strong>Photo Sources could not be displayed.</strong>Your Table is still available.<br>${btn('','Retry Photo Sources','','onclick="setMode(\'expanded\')"')}</div></aside></div>
${new URLSearchParams(location.search).has('capture')?'':`<nav class="review-switcher" aria-label="Prototype state selector"><span>REVIEW PROTOTYPE</span>${[['expanded','Expanded'],['compact','Compact'],['closed','Collapsed'],['project','Project'],['error','Error']].map(([v,l])=>`<button class="${v===mode||v==='project'&&view==='project'?'active':''}" onclick="setMode('${v}')">${l}</button>`).join('')}</nav>`}`;
renderGrid();
if(view==='project')document.querySelector('.footer').innerHTML='<span class="muted">Project details</span><span class="spacer"></span><span class="muted" style="font-size:11px">All changes saved</span>'+btn('back','Back to sources','secondary','onclick="setMode(\'expanded\')"');
document.querySelectorAll('.sequence-card').forEach(card=>{card.addEventListener('dragstart',()=>{window.dragCard=card;card.style.opacity='.45'});card.addEventListener('dragend',()=>{card.style.opacity='1';window.dragCard=null});card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();if(window.dragCard&&window.dragCard!==card){card.before(window.dragCard);document.querySelectorAll('.sequence-meta b').forEach((n,i)=>n.textContent=String(i+1).padStart(2,'0'))}})});
}
function renderGrid(){const grid=document.getElementById('photo-grid');if(grid)grid.innerHTML=Array.from({length:36},(_,i)=>i).filter(i=>(filter==='all'||(filter==='placed'?placedIds.has(i):!placedIds.has(i)))&&('DSC_'+(2041+i)+'.jpg').toLowerCase().includes(search.toLowerCase())).map(i=>`<button class="source-card ${selected.has(i)?'selected':''}" aria-pressed="${selected.has(i)}" aria-label="DSC_${2041+i}.jpg${placedIds.has(i)?', already on Table':''}" onclick="${placedIds.has(i)?`message('Already on Table — locate or preview this photo')`:`selected.has(${i})?selected.delete(${i}):selected.add(${i});renderGrid()`}"><span class="well"><img src="${photo(i+1)}" alt="Reference photograph">${placedIds.has(i)?'<span class="on-table">On Table</span>':''}</span><small>DSC_${2041+i}.jpg</small></button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.getElementById('selection-label').textContent=selected.size+' selected';const add=document.getElementById('add-button');add.textContent=selected.size?'Add '+selected.size+' to Table':'Add to Table';add.disabled=!selected.size;}
render();
</script></body></html>
