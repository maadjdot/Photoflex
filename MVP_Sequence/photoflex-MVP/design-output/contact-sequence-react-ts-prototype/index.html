<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoFlex — Contact Sheet & Sequence Prototypes</title>
  <style>
    :root {
      color: #111;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button { color: inherit; font: inherit; }
    .app { width: 100vw; height: 100vh; position: relative; background: #fff; }
    .topbar {
      height: 58px; padding: 0 22px; display: flex; align-items: center;
      border-bottom: 1px solid #dadada; background: #fff; position: relative; z-index: 20;
    }
    .brand { font-weight: 700; letter-spacing: -.04em; font-size: 19px; }
    .crumb { margin-left: 26px; padding-left: 26px; border-left: 1px solid #cfcfcf; font-size: 12px; }
    .modes { display: flex; gap: 22px; margin-left: 42px; height: 100%; align-items: center; }
    .mode { border: 0; background: none; height: 100%; padding: 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; position: relative; }
    .mode.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #111; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .text-button { border: 0; background: transparent; font-size: 11px; padding: 8px 10px; }
    .solid-button { border: 1px solid #111; background: #111; color: #fff; font-size: 11px; padding: 9px 14px; }
    .ghost-button { border: 1px solid #bdbdbd; background: #fff; font-size: 11px; padding: 8px 12px; }
    .state-chip { font-size: 10px; color: #555; border: 1px solid #d7d7d7; padding: 7px 9px; background: #f7f7f7; }
    .tiny { font-size: 9px; letter-spacing: .11em; text-transform: uppercase; color: #777; }
    .number { font-variant-numeric: tabular-nums; }
    .prototype-switcher {
      position: fixed; z-index: 100; left: 50%; bottom: 17px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px; padding: 4px; background: rgba(17,17,17,.94);
      color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.2);
    }
    .prototype-switcher button { width: 29px; height: 27px; border: 0; background: #111; color: #fff; cursor: pointer; }
    .prototype-label { min-width: 202px; text-align: center; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }

    /* A — Contact sheet */
    .contact-app { background: #070707; color: #f4f4f4; }
    .contact-app .topbar { background: #090909; color: #fff; border-color: #2b2b2b; }
    .contact-app .crumb { border-color: #3a3a3a; }
    .contact-app .mode.active::after { background: #fff; }
    .contact-app .text-button { color: #ccc; }
    .contact-app .ghost-button { border-color: #555; color: #fff; background: transparent; }
    .contact-workspace { height: calc(100vh - 58px); display: grid; grid-template-columns: 148px 1fr; }
    .filter-rail { border-right: 1px solid #292929; padding: 22px 16px; position: relative; }
    .filter-title { font-size: 9px; letter-spacing: .15em; color: #888; margin-bottom: 15px; }
    .filter { display: flex; justify-content: space-between; padding: 10px 8px; font-size: 11px; color: #999; border-left: 2px solid transparent; }
    .filter.active { color: #fff; background: #161616; border-left-color: #fff; }
    .filter-count { color: #666; }
    .contact-help { position: absolute; bottom: 80px; left: 22px; right: 18px; color: #666; font-size: 9px; line-height: 1.55; }
    .contact-main { min-width: 0; min-height: 0; display: grid; grid-template-rows: 38px minmax(0, 1fr) 45px; }
    .contact-toolbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid #242424; font-size: 9px; color: #888; }
    .contact-toolbar .right { margin-left: auto; display: flex; gap: 14px; }
    .film-stage { min-height: 0; overflow: hidden; padding: 18px 20px 10px; position: relative; }
    .film-roll { height: calc((100% - 36px) / 3); min-height: 185px; position: relative; margin-bottom: 12px; background: #111; border: 1px solid #313131; padding: 18px 12px; display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 7px; }
    .film-roll::before, .film-roll::after {
      content: ""; position: absolute; left: 0; right: 0; height: 8px;
      background: repeating-linear-gradient(90deg, transparent 0 9px, #5d5d5d 9px 16px, transparent 16px 26px);
      opacity: .65;
    }
    .film-roll::before { top: 4px; }
    .film-roll::after { bottom: 4px; }
    .negative { position: relative; min-width: 0; overflow: hidden; background: #1b1b1b; border: 1px solid #2e2e2e; }
    .negative img { width: 100%; height: 100%; display: block; object-fit: cover; filter: saturate(.86) contrast(1.06); }
    .negative .frame-no { position: absolute; right: 5px; bottom: 4px; color: rgba(255,255,255,.74); font-size: 8px; background: rgba(0,0,0,.55); padding: 2px 3px; }
    .negative.pick::after { content: ""; position: absolute; inset: 6px; border: 2px solid #ef4639; border-radius: 47% 53% 49% 51%; transform: rotate(-3deg); }
    .negative.active { outline: 2px solid #fff; outline-offset: 2px; }
    .negative.active::before { content: "PIN"; position: absolute; z-index: 2; top: 6px; left: 6px; font-size: 8px; color: #111; background: #fff; padding: 3px 5px; }
    .negative.reject img { opacity: .38; }
    .negative.reject::after { content: "×"; position: absolute; inset: 50% auto auto 50%; transform: translate(-50%,-50%); color: #ef4639; font-size: 34px; font-weight: 300; }
    .pool-bar { border-top: 1px solid #303030; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: #0c0c0c; }
    .pool-bar strong { font-size: 10px; letter-spacing: .14em; }
    .pool-thumbs { display: flex; gap: 4px; }
    .pool-thumbs img { width: 34px; height: 25px; object-fit: cover; opacity: .75; }
    .pool-note { margin-left: auto; color: #777; font-size: 9px; }

    /* B — Sequence editor */
    .sequence-shell { height: calc(100vh - 58px); display: grid; grid-template-columns: 184px 1fr; }
    .draft-rail { border-right: 1px solid #d9d9d9; padding: 20px 14px; background: #fafafa; }
    .draft-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 6px; }
    .draft-item { border: 1px solid transparent; padding: 11px 10px; margin-bottom: 5px; display: grid; gap: 5px; }
    .draft-item.active { border-color: #111; background: #fff; }
    .draft-name { font-size: 11px; font-weight: 600; }
    .draft-meta { font-size: 9px; color: #777; }
    .save-status { margin-top: 18px; border-top: 1px solid #ddd; padding: 14px 7px; font-size: 9px; color: #777; line-height: 1.55; }
    .sequence-main { min-width: 0; display: grid; grid-template-rows: 40px minmax(280px, 1fr) 236px 45px; }
    .editor-toolbar { border-bottom: 1px solid #dedede; padding: 0 18px; display: flex; align-items: center; gap: 16px; font-size: 9px; color: #666; }
    .editor-toolbar .tools-right { margin-left: auto; display: flex; gap: 6px; }
    .preview-stage { display: grid; place-items: center; padding: 20px; overflow: hidden; background: #fff; position: relative; }
    .preview-stage img { max-height: 100%; max-width: 64%; object-fit: contain; box-shadow: 0 0 0 1px #eee; }
    .preview-index { position: absolute; left: 20px; bottom: 16px; font-size: 9px; color: #777; }
    .preview-caption { position: absolute; right: 20px; bottom: 16px; max-width: 240px; text-align: right; font-size: 10px; color: #555; line-height: 1.45; }
    .timeline-panel { border-top: 1px solid #d9d9d9; padding: 13px 16px 12px; background: #f8f8f8; overflow: hidden; }
    .timeline-heading { display: flex; align-items: center; margin-bottom: 10px; }
    .timeline-heading .right { margin-left: auto; font-size: 9px; color: #777; }
    .timeline { height: 164px; display: flex; align-items: stretch; gap: 7px; overflow: hidden; }
    .seq-card { flex: 0 0 128px; min-width: 0; background: #fff; border: 1px solid #d3d3d3; position: relative; display: grid; grid-template-rows: 1fr 28px; }
    .seq-card.selected { border: 2px solid #111; }
    .seq-card img { width: 100%; height: 100%; object-fit: cover; min-height: 0; }
    .seq-meta { display: flex; align-items: center; justify-content: space-between; padding: 0 7px; font-size: 8px; }
    .drag-grip { letter-spacing: -2px; color: #999; }
    .seq-card.blank { flex-basis: 62px; background: repeating-linear-gradient(-45deg,#fff,#fff 5px,#f2f2f2 5px,#f2f2f2 6px); }
    .seq-card.blank .blank-label { display: grid; place-items: center; font-size: 8px; color: #777; writing-mode: vertical-rl; letter-spacing: .12em; }
    .seq-card.memo { flex-basis: 156px; grid-template-rows: 1fr 28px; padding-top: 0; }
    .memo-text { display: flex; align-items: center; padding: 18px; font-family: Georgia, serif; font-size: 13px; line-height: 1.45; }
    .insert-line { flex: 0 0 2px; background: #111; position: relative; margin: 0 1px; }
    .insert-line::before { content: "+"; position: absolute; left: 50%; top: -7px; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-size: 10px; }
    .sequence-pool { border-top: 1px solid #d0d0d0; display: flex; align-items: center; gap: 12px; padding: 0 17px; }
    .sequence-pool strong { font-size: 10px; letter-spacing: .13em; }
    .sequence-pool .pool-count { color: #777; font-size: 9px; }
    .sequence-pool .pool-note { color: #777; }

    /* C — Map + Pin */
    .map-main { height: calc(100vh - 58px); display: grid; grid-template-columns: 1fr 224px; }
    .map-canvas { position: relative; overflow: hidden; background-color: #fff; background-image: radial-gradient(#d9d9d9 .75px, transparent .75px); background-size: 18px 18px; }
    .map-controls { position: absolute; z-index: 4; top: 16px; left: 18px; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #cfcfcf; padding: 5px; }
    .map-controls button { border: 0; background: #fff; width: 27px; height: 25px; }
    .distance { width: 116px; height: 2px; background: #c9c9c9; position: relative; margin: 0 8px; }
    .distance::after { content:""; position:absolute; width:8px; height:8px; border-radius:50%; background:#111; left:69%; top:50%; transform:translate(-50%,-50%); }
    .map-photo { position: absolute; background: #eee; padding: 4px; border: 1px solid #c8c8c8; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .map-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .map-photo .map-no { position: absolute; left: 5px; bottom: -16px; font-size: 8px; color: #555; }
    .map-photo.pinned { border: 2px solid #111; padding: 3px; }
    .map-photo.pinned::after { content: "PIN"; position: absolute; top: -18px; right: -2px; background: #111; color: #fff; padding: 4px 5px; font-size: 8px; }
    .relation { position: absolute; height: 1px; background: #111; transform-origin: left center; z-index: 0; }
    .relation-label { position: absolute; z-index: 2; background: #fff; border: 1px solid #aaa; padding: 3px 6px; font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
    .pin-panel { border-left: 1px solid #d5d5d5; background: #fafafa; padding: 18px 16px; }
    .pin-panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .pin-panel h2 { font-size: 11px; margin: 0; text-transform: uppercase; letter-spacing: .12em; }
    .pin-card { background: #fff; border: 1px solid #ccc; margin-bottom: 12px; }
    .pin-card img { width: 100%; height: 122px; object-fit: cover; display: block; }
    .pin-card-body { padding: 9px; display: flex; justify-content: space-between; font-size: 9px; }
    .relation-editor { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 16px; }
    .relation-editor p { font-size: 9px; color: #666; line-height: 1.5; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { border: 1px solid #bbb; padding: 5px 7px; font-size: 8px; background: #fff; }
    .tag.active { background: #111; color: #fff; border-color: #111; }
    .map-footnote { position: absolute; left: 18px; bottom: 18px; background: #fff; border: 1px solid #d0d0d0; padding: 8px 10px; font-size: 9px; color: #666; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const photo = n => `../sequence-ui-prototype/assets/p${String(n).padStart(2, '0')}.jpg`;
    const variants = ['contact', 'sequence', 'map'];
    const params = new URLSearchParams(location.search);
    const current = variants.includes(params.get('variant')) ? params.get('variant') : 'contact';

    const topbar = (active, dark = false) => `
      <header class="topbar">
        <div class="brand">PhotoFlex</div>
        <div class="crumb">Patagonia Expedition</div>
        <nav class="modes">
          <button class="mode ${active === 'contact' ? 'active' : ''}">Contact Sheet</button>
          <button class="mode ${active === 'sequence' ? 'active' : ''}">Sequence</button>
          <button class="mode ${active === 'map' ? 'active' : ''}">Map</button>
          <button class="mode">Compare</button>
        </nav>
        <div class="top-actions">
          <span class="state-chip">${active === 'contact' ? '12 selected · Pool 07' : active === 'sequence' ? '2 unsaved moves · Pool 07' : '2 pinned · 1 relation'}</span>
          <button class="text-button">Undo</button>
          <button class="ghost-button">${active === 'sequence' ? 'Save checkpoint' : 'Export'}</button>
        </div>
      </header>`;

    function contact() {
      const nums = Array.from({length: 18}, (_, i) => i + 1);
      const rolls = [nums.slice(0,6), nums.slice(6,12), nums.slice(12,18)].map((roll, r) => `
        <div class="film-roll">
          ${roll.map((n, i) => `<div class="negative ${[2,9,15].includes(n) ? 'pick' : ''} ${n === 8 ? 'active' : ''} ${n === 12 ? 'reject' : ''}">
            <img src="${photo(((n - 1) % 16) + 1)}" alt="Frame ${n}" />
            <span class="frame-no">${String(r * 6 + i + 1).padStart(2,'0')}A</span>
          </div>`).join('')}
        </div>`).join('');
      return `<div class="app contact-app">${topbar('contact', true)}
        <div class="contact-workspace">
          <aside class="filter-rail">
            <div class="filter-title">CONTACT FILTER</div>
            <div class="filter active"><span>All frames</span><span class="filter-count">312</span></div>
            <div class="filter"><span>Picks</span><span class="filter-count">24</span></div>
            <div class="filter"><span>Rejects</span><span class="filter-count">18</span></div>
            <div class="filter"><span>Unrated</span><span class="filter-count">270</span></div>
            <div class="contact-help">← → Navigate<br/>Space Preview<br/>P Pin memory<br/>X Reject<br/>Enter Add to Pool</div>
          </aside>
          <main class="contact-main">
            <div class="contact-toolbar">
              <span>ROLL 01–03</span><span>35MM / 3:2</span><span>CAPTURE ORDER</span>
              <span class="right"><span>−</span><span>72%</span><span>＋</span></span>
            </div>
            <section class="film-stage">${rolls}</section>
            <div class="pool-bar">
              <strong>POOL 07</strong><span>⌃</span>
              <div class="pool-thumbs">${[2,4,7,10,13].map(n => `<img src="${photo(n)}" alt="Pool item" />`).join('')}</div>
              <span class="pool-note">Collapsed · Contact Sheet sorting never changes Sequence order</span>
            </div>
          </main>
        </div>
      </div>`;
    }

    function seqCard(n, selected = false) {
      return `<div class="seq-card ${selected ? 'selected' : ''}">
        <img src="${photo(n)}" alt="Sequence item ${n}" />
        <div class="seq-meta"><span>${String(n).padStart(2,'0')}</span><span class="drag-grip">•••</span></div>
      </div>`;
    }

    function sequence() {
      return `<div class="app">${topbar('sequence')}
        <div class="sequence-shell">
          <aside class="draft-rail">
            <div class="draft-title"><span class="tiny">Versions</span><button class="text-button">＋</button></div>
            <div class="draft-item"><span class="draft-name">Original import</span><span class="draft-meta">18 photos · Aug 26</span></div>
            <div class="draft-item active"><span class="draft-name">Draft 02</span><span class="draft-meta">18 items · editing</span></div>
            <div class="draft-item"><span class="draft-name">Quiet opening</span><span class="draft-meta">16 items · checkpoint</span></div>
            <div class="save-status">CURRENT STATE<br/><strong style="color:#111">2 unsaved moves</strong><br/>One completed drag = one undo step.</div>
          </aside>
          <main class="sequence-main">
            <div class="editor-toolbar"><span>EDIT STRIP</span><span>Drag to reorder</span><span>Double-click to inspect</span><div class="tools-right"><button class="text-button">＋ Blank</button><button class="text-button">＋ Memo</button></div></div>
            <section class="preview-stage">
              <img src="${photo(7)}" alt="Selected sequence photograph" />
              <span class="preview-index">07 / 18 · PINNED</span>
              <span class="preview-caption">A quiet transition before the ridge line.<br/><span class="tiny">Author memo</span></span>
            </section>
            <section class="timeline-panel">
              <div class="timeline-heading"><strong class="tiny">Sequence order</strong><span class="right">Horizontal strip · stable item IDs · controlled drag</span></div>
              <div class="timeline">
                ${seqCard(1)}${seqCard(3)}
                <div class="seq-card blank"><div class="blank-label">BLANK / PAUSE</div><div class="seq-meta"><span>03</span><span class="drag-grip">•••</span></div></div>
                ${seqCard(7, true)}
                <div class="insert-line"></div>
                ${seqCard(11)}
                <div class="seq-card memo"><div class="memo-text">“The mountain returns as memory, not destination.”</div><div class="seq-meta"><span>06</span><span class="drag-grip">•••</span></div></div>
                ${seqCard(14)}${seqCard(16)}
              </div>
            </section>
            <div class="sequence-pool"><strong>POOL</strong><span class="pool-count">07 PHOTOS</span><span>⌃</span><span class="pool-note">Collapsed · drag from Pool to insert</span></div>
          </main>
        </div>
      </div>`;
    }

    function mapPhoto(n, x, y, w, h, pinned = false) {
      return `<div class="map-photo ${pinned ? 'pinned' : ''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${photo(n)}" alt="Map photo ${n}"/><span class="map-no">${String(n).padStart(2,'0')}</span></div>`;
    }

    function map() {
      return `<div class="app">${topbar('map')}
        <main class="map-main">
          <section class="map-canvas">
            <div class="map-controls"><button>−</button><div class="distance"></div><button>＋</button><span class="tiny">72% · Fit all</span></div>
            <div class="relation" style="left:445px;top:392px;width:307px;transform:rotate(-18deg)"></div>
            <span class="relation-label" style="left:582px;top:329px">Echo / light</span>
            ${mapPhoto(1,80,118,175,114)}
            ${mapPhoto(3,302,176,133,186)}
            ${mapPhoto(5,510,92,207,132)}
            ${mapPhoto(7,752,156,174,115)}
            ${mapPhoto(8,198,425,204,133)}
            ${mapPhoto(10,448,382,143,198,true)}
            ${mapPhoto(12,682,330,217,137,true)}
            ${mapPhoto(14,945,413,132,183)}
            ${mapPhoto(15,86,658,158,105)}
            ${mapPhoto(16,336,646,202,127)}
            ${mapPhoto(4,616,623,137,191)}
            ${mapPhoto(6,830,654,219,137)}
            <div class="map-footnote">Map coordinates are a viewing layer — dragging here does not mutate Sequence order.</div>
          </section>
          <aside class="pin-panel">
            <div class="pin-panel-title"><h2>Pin memory</h2><span class="tiny">2 / 2</span></div>
            <div class="pin-card"><img src="${photo(10)}" alt="Pinned photo A"/><div class="pin-card-body"><span>Photo 10</span><span>A</span></div></div>
            <div class="pin-card"><img src="${photo(12)}" alt="Pinned photo B"/><div class="pin-card-body"><span>Photo 12</span><span>B</span></div></div>
            <div class="relation-editor"><span class="tiny">Describe relation</span><p>Keep the judgement human-authored. AI can suggest later, but should not silently define the reading.</p><div class="tag-list"><span class="tag active">Light</span><span class="tag">Gesture</span><span class="tag">Place</span><span class="tag">Memory</span><span class="tag">Contrast</span></div></div>
          </aside>
        </main>
      </div>`;
    }

    const root = document.getElementById('root');
    root.innerHTML = current === 'contact' ? contact() : current === 'sequence' ? sequence() : map();

    const switcher = document.createElement('div');
    switcher.className = 'prototype-switcher';
    switcher.innerHTML = `<button data-dir="-1" aria-label="Previous variant">←</button><div class="prototype-label">Prototype ${variants.indexOf(current)+1}/3 · ${current === 'contact' ? 'Analog Contact Sheet' : current === 'sequence' ? 'Sequence Edit Strip' : 'Map + Pin Memory'}</div><button data-dir="1" aria-label="Next variant">→</button>`;
    document.body.appendChild(switcher);
    function move(dir) {
      const next = variants[(variants.indexOf(current) + dir + variants.length) % variants.length];
      location.search = `?variant=${next}`;
    }
    switcher.addEventListener('click', e => { const d = e.target.dataset.dir; if (d) move(Number(d)); });
    window.addEventListener('keydown', e => {
      if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
    });
  </script>
</body>
</html>
