<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoFlex — Table Prototype</title>
  <style>
    @font-face { font-family: Ancizar; src: url('../../src/assets/fonts/AncizarSerif.ttf'); }
    :root { --ink:#1c1814; --muted:#72706d; --line:#bcbcbc; --paper:#fff8f0; --surface:#fff; --red:#1c1814; --desk:#e7e1d8; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; color:var(--ink); background:#fff; font-family:Arial,"Helvetica Neue",sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .app { width:100vw; height:100vh; min-width:1024px; display:grid; grid-template-rows:80px 1fr; background:#fff; }
    .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 36px; border-bottom:1px solid var(--line); background:#fff; }
    .brand { justify-self:start; border:0; background:transparent; font-family:Ancizar,Georgia,serif; font-size:25px; font-weight:700; }
    .project-title { padding-left:24px; border-left:1px solid var(--line); font-size:14px; }
    .nav { display:flex; align-items:stretch; gap:28px; height:100%; }
    .nav button { position:relative; border:0; background:transparent; color:var(--muted); font-size:14px; }
    .nav button.active { color:var(--ink); font-weight:700; }
    .nav button.active::after { content:""; position:absolute; right:0; bottom:0; left:0; height:2px; background:var(--red); }
    .top-actions { justify-self:end; display:flex; align-items:center; gap:15px; }
    .top-actions button { border:0; background:transparent; font-size:13px; }
    .top-actions .primary { padding:9px 16px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); }
    .workspace { min-height:0; display:grid; grid-template-columns:212px minmax(0,1fr) 312px; }
    .rail { min-width:0; border-right:1px solid var(--line); background:#fff; }
    .rail.right { border-right:0; border-left:1px solid var(--line); background:var(--paper); }
    .rail-heading { padding:25px 24px 18px; border-bottom:1px solid var(--line); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .rail-item { display:grid; gap:7px; padding:18px 24px; border-bottom:1px solid var(--line); }
    .rail-item.active { position:relative; background:var(--paper); }
    .rail-item.active::before { content:""; position:absolute; top:16px; bottom:16px; left:0; width:3px; background:var(--red); }
    .rail-item strong { font-size:14px; }
    .rail-item span { color:var(--muted); font-size:11px; }
    .rail-footer { position:absolute; bottom:20px; padding:0 24px; color:var(--muted); font-size:10px; line-height:1.55; }
    .main { min-width:0; min-height:0; display:grid; grid-template-rows:56px minmax(0,1fr) 50px; }
    .toolbar { display:flex; align-items:center; gap:20px; padding:0 20px; border-bottom:1px solid var(--line); font-size:12px; }
    .toolbar .muted { color:var(--muted); }
    .toolbar .spacer { margin-left:auto; }
    .toolbar button { border:0; background:transparent; font-size:12px; }
    .toolbar .outline { padding:8px 12px; border:1px solid var(--ink); background:#fff; }
    .desk { position:relative; min-height:0; overflow:hidden; background-color:var(--desk); background-image:radial-gradient(rgba(28,24,20,.13) .55px,transparent .55px); background-size:15px 15px; }
    .desk::before { content:"TABLE / WORKING SURFACE"; position:absolute; top:18px; left:20px; color:rgba(28,24,20,.48); font-size:10px; letter-spacing:.13em; }
    .desk::after { content:"Drag · group · compare · create sequence"; position:absolute; right:20px; bottom:16px; color:rgba(28,24,20,.52); font-size:10px; }
    .photo { position:absolute; z-index:2; padding:7px 7px 25px; background:#fff; box-shadow:0 7px 18px rgba(28,24,20,.16); transition:box-shadow .15s; }
    .photo img { display:block; width:100%; height:100%; object-fit:cover; }
    .photo .caption { position:absolute; right:8px; bottom:7px; left:8px; display:flex; justify-content:space-between; color:#5d5954; font-size:9px; }
    .photo.selected { z-index:5; box-shadow:0 0 0 2px var(--ink),0 10px 20px rgba(28,24,20,.2); }
    .photo.selected::before { content:"SELECTED"; position:absolute; z-index:2; top:-18px; left:0; padding:4px 6px; background:var(--ink); color:#fff; font-size:8px; letter-spacing:.12em; }
    .photo.pinned::after { content:"PIN"; position:absolute; top:7px; right:7px; padding:3px 5px; background:var(--ink); color:#fff; font-size:8px; letter-spacing:.08em; }
    .photo.pick .caption::before { content:"PICK"; color:var(--ink); font-weight:700; }
    .photo.reject { opacity:.45; }
    .photo.reject .caption::before { content:"REJECT"; color:#8b2d20; }
    .connection { position:absolute; z-index:1; height:1px; background:rgba(28,24,20,.58); transform-origin:left center; }
    .connection-label { position:absolute; z-index:4; padding:4px 7px; border:1px solid #aaa198; background:rgba(255,248,240,.92); color:#5d5954; font-size:9px; }
    .stack { position:absolute; z-index:3; display:grid; place-items:center; width:190px; height:132px; border:1px solid #aaa198; background:rgba(255,255,255,.73); box-shadow:3px 3px 0 #c0b8ae,6px 6px 0 #d0c9c0; }
    .stack strong { display:block; font-size:12px; }
    .stack span { display:block; margin-top:5px; color:var(--muted); font-size:10px; }
    .bottom-bar { display:flex; align-items:center; gap:20px; padding:0 20px; border-top:1px solid var(--line); background:#fff; font-size:11px; }
    .bottom-bar .count { font-weight:700; letter-spacing:.08em; }
    .bottom-bar .spacer { margin-left:auto; color:var(--muted); }
    .bottom-bar button { padding:7px 12px; border:1px solid var(--ink); background:#fff; font-size:11px; }
    .bottom-bar .primary { background:var(--ink); color:var(--paper); }
    .inspector-heading { display:flex; justify-content:space-between; align-items:center; padding:25px 24px 18px; border-bottom:1px solid var(--line); }
    .inspector-heading strong { font-size:13px; }
    .inspector-heading span { color:var(--muted); font-size:11px; }
    .inspector-section { padding:22px 24px; border-bottom:1px solid var(--line); }
    .eyebrow { margin-bottom:12px; color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    .selection-preview { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
    .selection-preview img { width:100%; aspect-ratio:4/3; object-fit:cover; border:2px solid var(--ink); }
    .selection-meta { display:flex; justify-content:space-between; margin-top:9px; font-size:11px; }
    .inspector-actions { display:grid; gap:8px; }
    .inspector-actions button { min-height:36px; border:1px solid var(--ink); background:#fff; text-align:left; padding:0 12px; font-size:12px; }
    .inspector-actions button.primary { background:var(--ink); color:var(--paper); }
    .inspector-note { color:var(--muted); font-size:11px; line-height:1.55; }
    .legend { display:grid; gap:10px; color:var(--muted); font-size:11px; }
    .legend-row { display:flex; align-items:center; gap:9px; }
    .legend-dot { width:8px; height:8px; border:1px solid var(--ink); background:#fff; }
    .legend-dot.black { background:var(--ink); }
    .legend-dot.red { border-color:#8b2d20; background:#8b2d20; }

    /* Variant B — trays */
    .trays { grid-template-columns:212px minmax(0,1fr) 252px; }
    .tray-desk { min-height:0; display:grid; grid-template-rows:64px 1fr; background:var(--desk); }
    .tray-intro { display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--line); }
    .tray-intro h1 { margin:0; font-family:Ancizar,Georgia,serif; font-size:22px; font-weight:700; }
    .tray-intro span { color:var(--muted); font-size:11px; }
    .zones { min-height:0; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:20px; }
    .zone { min-width:0; min-height:0; padding:14px; border:1px dashed #a9a096; background:rgba(255,255,255,.25); }
    .zone.keep { border-style:solid; background:rgba(255,255,255,.45); }
    .zone h2 { display:flex; justify-content:space-between; margin:0 0 13px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    .zone h2 span { color:var(--muted); font-weight:400; letter-spacing:0; }
    .zone-photos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 9px; }
    .zone .small-photo { position:relative; padding:5px 5px 19px; background:#fff; box-shadow:0 4px 10px rgba(28,24,20,.14); }
    .zone .small-photo img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
    .zone .small-photo span { position:absolute; right:6px; bottom:5px; left:6px; color:var(--muted); font-size:8px; }
    .zone .small-photo.selected { outline:2px solid var(--ink); outline-offset:2px; }
    .zone.reject-zone { opacity:.72; }
    .tray-side { min-width:0; padding:22px 18px; border-left:1px solid var(--line); background:var(--paper); }
    .tray-side h2 { margin:0 0 18px; font-size:13px; }
    .rule { margin-bottom:18px; padding-bottom:17px; border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; line-height:1.5; }
    .rule strong { display:block; margin-bottom:5px; color:var(--ink); font-size:11px; }
    .tray-side button { width:100%; margin-bottom:8px; padding:9px 10px; border:1px solid var(--ink); background:#fff; text-align:left; font-size:11px; }
    .tray-side button.primary { background:var(--ink); color:var(--paper); }

    /* Variant C — table + sequence lane */
    .lane-layout { grid-template-columns:212px minmax(0,1fr); }
    .lane-main { min-width:0; min-height:0; display:grid; grid-template-rows:56px minmax(0,1fr) 196px 50px; }
    .lane-desk { min-height:0; position:relative; overflow:hidden; background:var(--desk); background-image:radial-gradient(rgba(28,24,20,.13) .55px,transparent .55px); background-size:15px 15px; }
    .lane-desk .desk-label { position:absolute; top:18px; left:20px; color:rgba(28,24,20,.48); font-size:10px; letter-spacing:.13em; }
    .lane-selected { position:absolute; top:76px; left:50%; width:380px; height:272px; padding:9px 9px 30px; background:#fff; box-shadow:0 7px 18px rgba(28,24,20,.16); transform:translateX(-50%) rotate(-1deg); }
    .lane-selected img { display:block; width:100%; height:100%; object-fit:cover; }
    .lane-selected span { position:absolute; right:10px; bottom:9px; left:10px; display:flex; justify-content:space-between; color:var(--muted); font-size:9px; }
    .lane-selected::before { content:"PINNED · 07"; position:absolute; top:-18px; left:0; padding:4px 6px; background:var(--ink); color:#fff; font-size:8px; letter-spacing:.12em; }
    .lane-photo { position:absolute; width:120px; height:96px; padding:5px 5px 19px; background:#fff; box-shadow:0 4px 10px rgba(28,24,20,.14); }
    .lane-photo img { width:100%; height:100%; object-fit:cover; }
    .lane-photo span { position:absolute; right:6px; bottom:5px; left:6px; color:var(--muted); font-size:8px; }
    .lane-photo.a { top:85px; left:12%; transform:rotate(2deg); }
    .lane-photo.b { top:250px; left:16%; transform:rotate(-2deg); }
    .lane-photo.c { top:78px; right:12%; transform:rotate(2deg); }
    .lane-photo.d { top:273px; right:16%; transform:rotate(-3deg); }
    .lane-panel { min-height:0; overflow:hidden; padding:13px 16px; border-top:1px solid var(--line); background:var(--paper); }
    .lane-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .lane-heading strong { font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
    .lane-heading span { color:var(--muted); font-size:10px; }
    .sequence-lane { height:140px; display:flex; align-items:stretch; gap:8px; overflow:hidden; }
    .lane-card { flex:0 0 126px; padding:5px 5px 20px; border:1px solid #aaa198; background:#fff; position:relative; }
    .lane-card.selected { border:2px solid var(--ink); padding:4px 4px 19px; }
    .lane-card img { width:100%; height:100%; object-fit:cover; }
    .lane-card span { position:absolute; right:6px; bottom:5px; left:6px; display:flex; justify-content:space-between; color:var(--muted); font-size:8px; }
    .lane-card.blank { display:grid; place-items:center; border-style:dashed; color:var(--muted); font-size:9px; writing-mode:vertical-rl; }
    .lane-actions { display:flex; align-items:center; gap:20px; padding:0 20px; border-top:1px solid var(--line); background:#fff; font-size:11px; }
    .lane-actions .spacer { margin-left:auto; color:var(--muted); }
    .lane-actions button { padding:7px 12px; border:1px solid var(--ink); background:#fff; font-size:11px; }
    .lane-actions .primary { background:var(--ink); color:var(--paper); }

    .prototype-switcher { position:fixed; z-index:50; bottom:15px; left:50%; display:flex; align-items:center; gap:5px; padding:4px; background:var(--ink); color:#fff; box-shadow:0 5px 18px rgba(0,0,0,.2); transform:translateX(-50%); }
    .prototype-switcher button { width:30px; height:26px; border:0; background:var(--ink); color:#fff; }
    .prototype-label { min-width:238px; text-align:center; font-size:9px; letter-spacing:.11em; text-transform:uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const photo = n => `../sequence-ui-prototype/assets/p${String(n).padStart(2,'0')}.jpg`;
    const variants = ['A','B','C'];
    const names = { A:'Free Table · Recommended', B:'Triage Trays', C:'Table + Sequence Lane' };
    const current = variants.includes(new URLSearchParams(location.search).get('variant')) ? new URLSearchParams(location.search).get('variant') : 'A';
    const header = active => `<header class="topbar"><button class="brand">PhotoFlex</button><div class="project-title">Patagonia Expedition</div><nav class="nav"><button>Home</button><button>Project</button><button>Contact Sheet</button><button class="active">Table</button><button>Sequence</button></nav><div class="top-actions"><button>Share</button><button class="primary">Publish</button></div></header>`;
    const leftRail = `<aside class="rail"><div class="rail-heading">Project</div><div class="rail-item active"><strong>Patagonia Expedition</strong><span>312 photos · working</span></div><div class="rail-item"><strong>Reykjavik Portrait</strong><span>184 photos · sequenced</span></div><div class="rail-item"><strong>Tokyo Street — Night</strong><span>97 photos · draft</span></div><div class="rail-footer">TABLE IS A WORKING SET<br/>Removing a photo from Table never deletes the source photo.</div></aside>`;
    function p(n, cls, style, label=n) { return `<div class="photo ${cls||''}" style="${style||''}"><img src="${photo(n)}" alt="Photo ${n}"/><span class="caption"><span>${String(label).padStart(2,'0')}</span><span>•••</span></span></div>`; }
    function variantA() { return `<div class="app">${header('table')}<div class="workspace">${leftRail}<main class="main"><div class="toolbar"><strong>TABLE</strong><span class="muted">18 on table · 4 selected</span><span class="spacer"></span><button>Arrange ▾</button><button>Stack</button><button class="outline">Compare (2)</button></div><section class="desk">${p(2,'selected pick','left:12%;top:16%;width:174px;height:143px;transform:rotate(-2deg)')}${p(7,'pinned','left:34%;top:12%;width:207px;height:157px;transform:rotate(1deg)')}${p(10,'selected','left:56%;top:19%;width:150px;height:201px;transform:rotate(2deg)')}${p(12,'pick','left:76%;top:14%;width:190px;height:143px;transform:rotate(-1deg)')}${p(4,'','left:19%;top:55%;width:192px;height:142px;transform:rotate(1deg)')}${p(8,'selected','left:43%;top:54%;width:166px;height:199px;transform:rotate(-2deg)')}${p(14,'selected pick','left:66%;top:56%;width:205px;height:151px;transform:rotate(2deg)')}<div class="stack" style="left:4%;top:72%"><div><strong>UNREVIEWED</strong><span>7 photos · click to open</span></div></div><div class="connection" style="left:57%;top:49%;width:184px;transform:rotate(18deg)"></div><div class="connection-label" style="left:60%;top:43%">similar light</div></section><div class="bottom-bar"><span class="count">18 ON TABLE</span><button>Arrange</button><button>Group</button><button>Remove</button><span class="spacer">Drag from Contact Sheet to add</span><button class="primary">Create Sequence</button></div></main><aside class="rail right"><div class="inspector-heading"><strong>Selected photos</strong><span>4 / 18</span></div><div class="inspector-section"><div class="eyebrow">Compare selection</div><div class="selection-preview"><img src="${photo(10)}" alt="Photo 10"/><img src="${photo(14)}" alt="Photo 14"/></div><div class="selection-meta"><span>Photo 10 ↔ Photo 14</span><span>⌘ C</span></div></div><div class="inspector-section"><div class="eyebrow">Actions</div><div class="inspector-actions"><button class="primary">Create Sequence from 4</button><button>Pin selected</button><button>Move to stack…</button><button>Remove from Table</button></div></div><div class="inspector-section"><div class="eyebrow">State</div><div class="legend"><div class="legend-row"><i class="legend-dot black"></i> selected / pinned</div><div class="legend-row"><i class="legend-dot"></i> on Table</div><div class="legend-row"><i class="legend-dot red"></i> Pick / Reject marker</div></div></div></aside></div></div>`; }
    function small(n, cls='') { return `<div class="small-photo ${cls}"><img src="${photo(n)}" alt="Photo ${n}"/><span>Photo ${String(n).padStart(2,'0')}</span></div>`; }
    function variantB() { return `<div class="app">${header('table')}<div class="workspace trays">${leftRail}<main class="main"><div class="toolbar"><strong>TABLE / TRIAGE</strong><span class="muted">Sort by decision · 31 remaining</span><span class="spacer"></span><button>Clear rejected</button><button class="outline">Auto arrange</button></div><section class="tray-desk"><div class="tray-intro"><h1>Make a first cut.</h1><span>Place printed photos into a decision tray.</span></div><div class="zones"><section class="zone keep"><h2>Keep <span>08</span></h2><div class="zone-photos">${small(2,'selected')}${small(7)}${small(10)}${small(14)}${small(16)}${small(3)}</div></section><section class="zone"><h2>Maybe <span>12</span></h2><div class="zone-photos">${small(1)}${small(4)}${small(8,'selected')}${small(11)}${small(13)}${small(15)}</div></section><section class="zone reject-zone"><h2>Reject <span>11</span></h2><div class="zone-photos">${small(5)}${small(6)}${small(9)}${small(12)}${small(17)}${small(18)}</div></section></div></section><div class="bottom-bar"><span class="count">31 SORTED</span><span class="spacer">Decisions are independent from Sequence order</span><button class="primary">Open free Table</button></div></main><aside class="tray-side"><h2>Decision trays</h2><div class="rule"><strong>Keep</strong>Photos safe to bring into a reading. Drag to Sequence when ready.</div><div class="rule"><strong>Maybe</strong>Photos worth comparing or revisiting later.</div><div class="rule"><strong>Reject</strong>Hidden from future views, never deleted from the project.</div><button class="primary">Create Sequence from Keep</button><button>Compare selected</button><button>Undo last move</button></aside></div></div>`; }
    function laneCard(n, cls='') { return `<div class="lane-card ${cls}"><img src="${photo(n)}" alt="Sequence photo ${n}"/><span><span>${String(n).padStart(2,'0')}</span><span>•••</span></span></div>`; }
    function variantC() { return `<div class="app">${header('table')}<div class="workspace lane-layout">${leftRail}<main class="lane-main"><div class="toolbar"><strong>TABLE / READING DRAFT</strong><span class="muted">Draft 02 · 2 pinned</span><span class="spacer"></span><button>Compare</button><button class="outline">Save checkpoint</button></div><section class="lane-desk"><span class="desk-label">WORKING TABLE · 4 photos selected</span><div class="lane-photo a"><img src="${photo(2)}" alt="Photo 02"/><span>02 · candidate</span></div><div class="lane-photo b"><img src="${photo(4)}" alt="Photo 04"/><span>04 · candidate</span></div><div class="lane-photo c"><img src="${photo(12)}" alt="Photo 12"/><span>12 · pinned</span></div><div class="lane-photo d"><img src="${photo(14)}" alt="Photo 14"/><span>14 · pinned</span></div><div class="lane-selected"><img src="${photo(7)}" alt="Photo 07"/><span><span>07 · pinned</span><span>Use ← → to read</span></span></div></section><section class="lane-panel"><div class="lane-heading"><strong>Sequence draft · 08 items</strong><span>Drag cards to refine reading order</span></div><div class="sequence-lane">${laneCard(1)}${laneCard(3)}<div class="lane-card blank">BLANK / PAUSE</div>${laneCard(7,'selected')}${laneCard(10)}${laneCard(14)}${laneCard(16)}</div></section><div class="lane-actions"><span>Table remains the source of experiments</span><span class="spacer">1 unsaved move</span><button>Undo</button><button class="primary">Publish Reading</button></div></main></div></div>`; }
    document.getElementById('root').innerHTML = current === 'A' ? variantA() : current === 'B' ? variantB() : variantC();
    const switcher = document.createElement('div'); switcher.className='prototype-switcher'; switcher.innerHTML=`<button data-dir="-1">←</button><div class="prototype-label">Prototype ${current} · ${names[current]}</div><button data-dir="1">→</button>`; document.body.appendChild(switcher);
    function move(dir) { const next=variants[(variants.indexOf(current)+dir+variants.length)%variants.length]; location.search='?variant='+next; }
    switcher.onclick=e=>{ if(e.target.dataset.dir) move(Number(e.target.dataset.dir)); }; window.onkeydown=e=>{ if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return; if(e.key==='ArrowLeft') move(-1); if(e.key==='ArrowRight') move(1); };
  </script>
</body>
</html>
