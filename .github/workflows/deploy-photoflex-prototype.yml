name: Deploy PhotoFlex prototype to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "prototypes/photoflex-core-prototype/**"
      - ".github/workflows/deploy-photoflex-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype site
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototypes/photoflex-core-prototype

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
